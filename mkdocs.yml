site_name: G1 Neck Docs

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Deployment: getting-started/deployment.md
  - Hardware:
    - Parts and BOM: hardware/parts-and-bom.md
    - Assembly: hardware/assembly.md  
    - Wiring: hardware/wiring.md  
  - Troubleshooting:
    - Common issues: troubleshooting.md  

theme:
  name: readthedocs
  logo: assets/gear.svg
  custom_dir: theme_overrides
  favicon: assets/favicon/favicon.ico

extra_css:
  - language-selector.css
  - logo.css 

extra_javascript:
  - copy-button.js  # copy button for code blocks

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight
  - attr_list
  - admonition 

plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Getting Started: 始めに
            Installation: インストール
            Deployment: 実行
            Troubleshooting: 問題解決
            Common issues: よくある問題
            Hardware: ハードウェア
            Parts and BOM: 部品について
            Wiring: 配線
            Assembly: 組み立て